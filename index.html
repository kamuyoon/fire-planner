<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>소방 기출회독 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: OMR 답안지 콘셉트 — 상단 요약+123칸 진도 버블, 탭 아래 하루 기록 */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1b1f25; --muted:#646b75; --line:#e2e5ea;
  --omr:#cc3555; --omr-soft:#fbe9ed;
  --s-haeng:#2c64a3; --s-beop:#bf4f28; --s-hak:#24805a; --s-mock:#7550b0; --s-etc:#6a717a;
  --good:#24805a; --warn:#b2731a; --bad:#bf3434;
  --f-disp:'Gothic A1','IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#14171b; --surface:#1c2025; --ink:#e7e9ec; --muted:#9aa1aa; --line:#2e333a;
  --omr:#f06c88; --omr-soft:#3a1f27;
  --s-haeng:#6ea6e6; --s-beop:#ec8c63; --s-hak:#62c493; --s-mock:#ab92e3; --s-etc:#9aa1aa;
  --good:#62c493; --warn:#e2a54a; --bad:#f07373; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--omr);outline-offset:2px}
.num,output,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.brand h1{font-size:26px;font-weight:800;letter-spacing:-.01em}
.brand h1 em{font-style:normal;color:var(--omr)}
.brand p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:14px}
.stat{display:grid}
.stat .k{font-size:11px;letter-spacing:.06em;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-size:19px;font-weight:600}
.stat.s-haeng .v{color:var(--s-haeng)}.stat.s-beop .v{color:var(--s-beop)}.stat.s-hak .v{color:var(--s-hak)}
.save{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:10px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--good)}

.omr{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.omr h2{font-size:12px;letter-spacing:.08em;color:var(--omr);font-weight:700;margin-bottom:6px}
.omr{min-width:0}
.omr-grid{display:grid;grid-template-columns:16px repeat(18,minmax(0,15px));gap:4px 3px;align-items:center;justify-items:center}
.omr-grid .bub{width:min(13px,100%);height:auto;aspect-ratio:1}
.omr-grid .ch,.omr-grid .rh{font-family:var(--f-mono);font-size:9px;color:var(--omr)}
.bub{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--omr);background:transparent;padding:0}
.bub.past{border-style:dashed;opacity:.7}
.bub.off{border-color:var(--muted);opacity:.4}
.bub.g{background:var(--good);border-color:var(--good)}
.bub.w{background:var(--warn);border-color:var(--warn)}
.bub.b{background:var(--bad);border-color:var(--bad)}
.bub.mk{box-shadow:inset 0 0 0 2px var(--surface),inset 0 0 0 4px var(--s-mock)}
.bub.td{outline:2px solid var(--ink);outline-offset:1px}
.bub.sel{transform:scale(1.25)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend .bub{width:10px;height:10px;pointer-events:none}

.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--muted);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--omr);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.muted{color:var(--muted)}
.small{font-size:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:13px}
.btn:hover{border-color:var(--muted)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

.weekbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.weekbar .wk-title{font-family:var(--f-disp);font-size:18px;font-weight:700;display:flex;gap:8px;align-items:baseline}
.weekbar .wk-title span{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-weight:500}
.weekbar .sp{flex:1}
.pills{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 4px;display:grid;justify-items:center;gap:1px}
.pill .pd{font-size:11px;color:var(--muted)}
.pill .pn{font-family:var(--f-mono);font-weight:600}
.pill .pr{font-family:var(--f-mono);font-size:11px}
.pill.on{border-color:var(--omr);background:var(--omr-soft)}
.pill.today .pd{color:var(--omr);font-weight:700}
.r-g{color:var(--good)} .r-w{color:var(--warn)} .r-b{color:var(--bad)} .r-n{color:var(--muted)}
.weeksum{margin-top:10px;font-size:13px}

.day{display:grid;gap:12px;margin-top:16px}
.dayhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.dayhead h2{font-size:22px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);font-family:var(--f-mono)}
.chip.g{color:var(--good);border-color:currentColor} .chip.w{color:var(--warn);border-color:currentColor} .chip.b{color:var(--bad);border-color:currentColor}
.offt{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-left:auto}
.notice{background:var(--omr-soft);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.hint{border-left:3px solid var(--warn);padding:4px 10px;font-size:13px}
.events{display:flex;flex-wrap:wrap;gap:6px}
.ev{font-size:12px;border-radius:6px;padding:3px 9px;background:color-mix(in srgb,var(--s-mock) 13%,transparent);color:var(--s-mock);font-weight:500}
.ev.etc{background:var(--bg);color:var(--muted)}

.sub{position:relative;border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;background:var(--surface);overflow:hidden;display:grid;grid-template-columns:96px minmax(0,1fr) auto;grid-template-areas:"n info tgt" "n log log";gap:8px 14px;align-items:center}
.sub::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sc)}
.sub::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:var(--sc);opacity:.45}
.sub.zero{opacity:.55}
.s-haeng{--sc:var(--s-haeng)}.s-beop{--sc:var(--s-beop)}.s-hak{--sc:var(--s-hak)}
.sub .n{grid-area:n;font-family:var(--f-disp);font-weight:800;font-size:17px;color:var(--sc);align-self:start}
.sub .n small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted)}
.sub .info{grid-area:info;min-width:0}
.sub .info .rg{font-family:var(--f-mono);font-size:15px;font-weight:600}
.sub .stg{font-size:12px;font-weight:600;color:var(--sc);letter-spacing:.02em}
.sub .tipl{margin-top:2px;color:var(--ink);opacity:.75}
.rd select,.rd .w{border:1px solid var(--line);border-radius:5px;padding:3px 4px;background:var(--surface);font-size:12px;min-width:0}
.rd .w{width:52px;font-family:var(--f-mono);text-align:right}
.cps{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.cps span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.cps i{font-style:normal;color:var(--sc);font-weight:600}
.sub .tgt b small{font-size:12px;font-weight:500}
.sub .info .why{font-size:12px;color:var(--muted)}
.sub .tgt{grid-area:tgt;text-align:right}
.sub .tgt b{font-family:var(--f-mono);font-size:22px;color:var(--sc)}
.sub .tgt span{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.sub .log{grid-area:log;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.lg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.lg input{width:84px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--surface);font-family:var(--f-mono);font-size:15px;text-align:right}
.lg input.h{width:66px}
.lg input:focus{border-color:var(--sc);outline:none}
.res{font-family:var(--f-mono);font-size:13px}

.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.box h3{font-size:13px;font-weight:700}
.inline{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.inline label{display:flex;align-items:center;gap:6px;font-size:13px}
.inline input[type=number]{width:72px;border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--surface);font-family:var(--f-mono);text-align:right}
.todo{display:flex;align-items:center;gap:8px}
.todo input[type=text]{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:5px;padding:4px 6px}
.todo input[type=text]:hover{border-color:var(--line)} .todo input[type=text]:focus{border-color:var(--omr);outline:none}
.todo.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.todo input[type=checkbox]{width:16px;height:16px;accent-color:var(--omr)}
.todo button{border:0;background:none;color:var(--muted);font-size:12px}
ul.tips{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:grid;gap:2px}
textarea.note{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);resize:vertical;line-height:1.55}

@media (max-width:760px){
  .top{grid-template-columns:minmax(0,1fr)}
  .sub{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n tgt" "info info" "log log"}
  .pills{gap:4px}
  .pill .pr{font-size:10px}
  .offt{margin-left:0}
}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--bg)}
tr.wsep td{background:var(--omr-soft);color:var(--omr);font-family:var(--f-mono);font-size:12px;font-weight:600;padding:4px 10px}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--omr) 5%,transparent)}
tr.today td:first-child{box-shadow:inset 3px 0 0 var(--omr)}
tr.past td{opacity:.75}
td.date{font-family:var(--f-mono);white-space:nowrap}
td b{font-family:var(--f-mono);font-weight:600}
.c-haeng{color:var(--s-haeng)}.c-beop{color:var(--s-beop)}.c-hak{color:var(--s-hak)}
.ov td{min-width:130px}
.ov td.date,.ov td.n{min-width:0}
.cell .rr{font-family:var(--f-mono);font-size:12px}
.cell .ac{font-family:var(--f-mono);font-size:12px}
.tin{width:100%;min-width:64px;border:1px solid transparent;background:transparent;border-radius:5px;padding:3px 5px}
.tin:hover{border-color:var(--line)} .tin:focus{border-color:var(--omr);outline:none;background:var(--surface)}
.tin.n{font-family:var(--f-mono);text-align:right;min-width:52px}
input[type=date].tin{font-family:var(--f-mono);min-width:130px}

.sec{display:grid;gap:12px}
.sec h2{font-size:18px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface);border-top:4px solid var(--sc)}
.plan h3{font-size:18px;color:var(--sc)}
.plan .tot{display:flex;align-items:center;gap:8px;font-size:13px}
.plan .tot input{width:100px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-family:var(--f-mono);font-size:16px;background:var(--surface);text-align:right}
.rounds{display:grid;gap:6px}
.rd{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--line)}
.rd .k{font-family:var(--f-mono);font-weight:600}
.rd .ctl{display:flex;gap:4px;min-width:0}
.rd .ctl input[type=date]{flex:1}
.rd.ns{border-top:2px solid var(--line);margin-top:4px}
.rd .st{grid-column:2/4;font-size:12px;color:var(--muted)}
.rd .bar{grid-column:1/4;height:4px;border-radius:2px;background:var(--bg);overflow:hidden}
.rd .bar i{display:block;height:100%;background:var(--sc)}
.rd input[type=date]{border:1px solid var(--line);border-radius:5px;padding:3px 6px;font-family:var(--f-mono);background:var(--surface);min-width:0;width:100%}
.rd button{border:0;background:none;color:var(--muted);font-size:12px}
.gates{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.gate{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.gate h3{font-size:16px}
.gate li{list-style:none;display:flex;gap:8px;align-items:flex-start}
.gate ul{margin:0;padding:0;display:grid;gap:8px}
.gate input[type=checkbox]{width:16px;height:16px;margin-top:3px;accent-color:var(--omr)}
.verdict{border-radius:8px;padding:8px 10px;font-size:13px}
.verdict.ok{background:color-mix(in srgb,var(--good) 14%,transparent)}
.verdict.no{background:color-mix(in srgb,var(--warn) 14%,transparent)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.rules .box ul{margin:0;padding-left:18px;display:grid;gap:4px}
.spark{width:100%;max-width:520px;height:auto}
.spark text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
textarea.json{width:100%;min-height:90px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface)}
@media (prefers-reduced-motion:no-preference){.bub,.sub::after,.rd .bar i{transition:all .2s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div id="brand"></div>
      <div class="stats" id="stats"></div>
      <div class="save" id="save"><i></i><span>이 브라우저에 자동 저장</span></div>
    </div>
    <section class="omr" aria-label="전체 진도표">
      <h2>OMR 진도표 · 주차 × 요일</h2>
      <div id="omr"></div>
    </section>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>

<script>
let START; const DEF_START='2026-10-27', DAYMS=864e5, BASE_EXAM='2027-02-27', DEF_EXAM='2027-03-06';
let EXAM,END,ALL,WEEKS,MOCK_J,MOCK_F,MOCKS,MOCK_START;
const toT=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const fromT=t=>new Date(t).toISOString().slice(0,10);
const addD=(s,n)=>fromT(toT(s)+n*DAYMS);
const diff=(a,b)=>Math.round((toT(a)-toT(b))/DAYMS);
const dow=s=>new Date(toT(s)).getUTCDay();
const WD='일월화수목금토';
const md=s=>`${+s.slice(5,7)}/${+s.slice(8,10)}`;
const wk=d=>Math.floor(diff(d,START)/7)+1;
const TODAY=(()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`})();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=x=>x===''||x==null||isNaN(+x)?null:+x;
const clone=o=>JSON.parse(JSON.stringify(o));

const SUBS=['haeng','beop','hak'];
const SN={haeng:'행정법',beop:'법규',hak:'학개론'};
// 모의고사 날짜는 시험 전날(END) 기준 며칠 전인지로 정함: 주말 모의 4회 + 마지막 25일 실전 13회
const MJ_OFF=[-48,-41,-34,-27], MF_OFF=[-24,-22,-20,-17,-15,-13,-10,-9,-7,-6,-4,-3,-1];
function setup(){
  START=S.start||DEF_START;EXAM=S.exam||DEF_EXAM;END=addD(EXAM,-1);
  ALL=[];for(let d=START;d<=END;d=addD(d,1))ALL.push(d);
  WEEKS=wk(END);
  MOCK_J=MJ_OFF.map(o=>addD(END,o)).filter(d=>d>=START);
  MOCK_F=MF_OFF.map(o=>addD(END,o)).filter(d=>d>=START);
  MOCKS=[...MOCK_J,...MOCK_F];MOCK_START=MOCK_F[0]||END;
  document.title=`소방 기출회독 플래너`;
}
// 공부 시작일 변경: 막판 5주를 뺀 앞쪽 일정(회독 마감·기간별 시간·진입조건)이 시작일과 같이 움직임
function changeStart(ns){
  const zone=addD(END,-35),delta=diff(ns,START);
  S.start=ns;setup();
  const cl=d=>d<START?START:d>END?END:d,sh=d=>cl(d<zone?addD(d,delta):d);
  S.phases.forEach(p=>p.from=sh(p.from));S.phases.sort((x,y)=>x.from<y.from?-1:1);S.phases[0].from=START;
}
// 시험일 변경: 막판 5주(모의·압축 구간)의 날짜는 시험일과 같이 움직이고, 앞쪽 일정은 그대로 둠
function changeExam(nx){
  const oldEND=END,oldMocks=MOCKS.slice(),zone=addD(oldEND,-35);
  S.exam=nx;setup();
  const delta=diff(END,oldEND),cl=d=>d<START?START:d>END?END:d,sh=d=>cl(d>=zone?addD(d,delta):d);
  S.phases.forEach(p=>p.from=sh(p.from));S.phases.sort((x,y)=>x.from<y.from?-1:1);
  const nm={};for(const [d,v] of Object.entries(S.mocks)){const i=oldMocks.indexOf(d);nm[i>=0&&MOCKS[i]?MOCKS[i]:d]=v}S.mocks=nm;
}
const DEF={
  pages:{haeng:1100,beop:null,hak:null},
  phases:[
    {from:'2026-10-27',haeng:7.5,beop:0,hak:0},
    {from:'2026-11-10',haeng:2.5,beop:5,hak:0},
    {from:'2026-12-01',haeng:1.5,beop:1.5,hak:4.5},
    {from:'2026-12-29',haeng:2,beop:2.5,hak:3},
  ],
};
/* 회독 단계 (유휘운식 로드맵)

/* 자동 계획 엔진
   - 각 과목은 회독마다 전체 페이지(N)를 봄. k회독 마감일까지 누적 k×N 페이지가 목표.
   - 하루 목표 = (현재 회독 마감까지 남은 페이지) × (오늘 시간 ÷ 마감까지 남은 시간 합)
   - 지난 날 기록이 없으면 0p로 계산되어 남은 날로 다시 나눠짐. 오늘 이후는 목표대로 한다고 가정해 범위를 미리 보여줌. */
function logOf(d,s){return (S.log[d]&&S.log[d][s])||null}
function countOf(L,N,defStart){
  if(!L)return null;
  const e=num(L.e);if(e==null)return null;
  const st=num(L.s)!=null?num(L.s):defStart;
  if(e>=st)return e-st+1;
  return N?(N-st+1)+e:null;
}
let P=null;
const pos0=(s,N)=>Math.min(Math.max(num((S.startAt||{})[s])||1,1),N)-1;
function compute(){
  const R={};
  for(const s of SUBS){
    const N=num(S.pages[s]),RD=S.rd[s]||[],ends=RD.map(rEnd);
    const H=ALL.map(d=>hrs(d,s)),D=ALL.map(d=>num(defHours(d)[s])||0);
    // 목표 계산용 시간: 기본 배정보다 더 넣은 시간은 재량이라 목표를 키우지 않음 (줄인 날은 줄인 만큼 반영)
    const HT=ALL.map((d,i)=>{const b=S.off[d]?0:(num(defHours(d)[s])||0);return b>0?Math.min(H[i],b):H[i]});
    // 진도 = 페이지 위치. 시작 p를 260으로 적으면 1~259p는 이번 회독에서 이미 본 것으로 봄.
    let round=1,pos=N?Math.min(Math.max(num((S.startAt||{})[s])||1,1),N)-1:0,done=null;R[s]={};
    ALL.forEach((d,i)=>{
      const h=H[i];let t=null,k=-1;
      if(N&&pos>=N){round++;pos=0}
      const L=logOf(d,s),ls=L&&num(L.s),pb=pos,cumP=N?(round-1)*N+pos:0;
      if(N&&ls!=null)pos=Math.min(Math.max(ls,1),N)-1;
      const cum=N?(round-1)*N+pos:0;
      let m=-1,E=null;
      if(N&&h>0){
        k=round-1;
        if(k>=RD.length)t=0;
        else{
          // 단계: 현재 회독부터, 마감이 오늘 이후인 첫 회독의 마감일까지 (밀린 회독은 다음 단계에 합쳐짐)
          const f=ends.findIndex((e,j)=>j>=k&&e>=d);
          E=f<0?END:ends[f];
          m=f<0?RD.length-1:ends.lastIndexOf(E);
          // 남은 일 = 현재 회독의 남은 비율×비중 + 단계 안 나머지 회독 비중 합
          let W=(1-pos/N)*(RD[k].w||1);for(let j=k+1;j<=m;j++)W+=RD[j].w||1;
          // 지난 날은 그 뒤 날들을 기본 시간으로 보고 계산 → 오늘 시간·쉬는 날을 바꿔도 지난 날 %가 변하지 않음
          let Hs=HT[i];for(let j=i+1;j<ALL.length&&ALL[j]<=E;j++)Hs+=d<TODAY?D[j]:HT[j];
          // 오늘 몫(비중 단위)을 회독별 비중으로 페이지로 환산 (비중이 작은 회독일수록 같은 시간에 더 많은 페이지)
          let u=W*HT[i]/Hs,p=0,kk=k,rem=N-pos;
          while(u>1e-9&&kk<=m){const w=RD[kk].w||1,need=rem/N*w;if(u>=need){p+=rem;u-=need;kk++;rem=N}else{p+=u/w*N;u=0}}
          t=Math.max(1,Math.ceil(p));
        }
      }
      const startPg=N?pos+1:null;
      const a=countOf(L,N,startPg||1);
      const rec={t,h,N,cum0:cum,round:N?round:null,startPg,planStart:N?pb+1:null,a,L,k,m,E,rt:RD[round-1]};
      if(a!=null){const e=num(L.e);if(e<startPg)round++;pos=Math.min(e,N);rec.endRound=round}
      else if(N&&d>=TODAY&&t){pos+=t;while(pos>N){pos-=N;round++}}
      rec.after=N?(round-1)*N+pos:0;
      // 계획 대비: 실제로 도달한 위치 - 계획대로 했을 때 도달했을 위치 (+면 앞섬)
      rec.gap=a!=null&&t?rec.after-(cumP+t):null;
      if(d<TODAY||(d===TODAY&&a!=null))done=rec.after;
      R[s][d]=rec;
    });
    R[s].done=done??(N?pos0(s,N):0);
  }
  return R;
}
const gapTxt=g=>g==null?'':g===0?'계획대로':g>0?`+${g}p 앞섬`:`${g}p 밀림`;
const gapCls=g=>g==null?'':g>=0?'r-g':'r-b';
function actTxt(r,short){
  if(r.a==null)return '';

}
function rangeTxt(r,short){

  let info,tgt;
  if(!N){info=`<div class="why">총 페이지 수를 입력하면 하루 범위가 계산됩니다. <button class="btn" data-act="tab" data-t="plan">입력</button></div>`;tgt=''}
  else if(r.h===0){info=`<div class="why">오늘은 배정 시간 없음${r.a?'':' · 시간을 넣으면 목표가 생깁니다'}</div>`;tgt=''}
  else if(r.t===0){info=`<div class="why">모든 회독 목표 달성</div>`;tgt=''}

    const RD=S.rd[s],stage=RD.slice(r.k,r.m+1).map((x,j)=>`${r.k+j+1}회독`).join('·');
    const per=Math.ceil(r.t/r.h),cps=[];
    for(let i=1;i<r.h;i++)cps.push(i);
    cps.push(r.h);
    const cp=cps.map(x=>`<span><i>${x}h</i> ${((r.startPg-1+Math.ceil(r.t*x/r.h)-1)%N)+1}p</span>`).join('');
    info=`<div class="rg">${rangeTxt(r)}</div><div class="cps" aria-label="시간별 도달 페이지">${cp}</div><div class="why">${stage} → ${md(r.E)}까지 · 남은 회독을 시간 비중(${RD.slice(r.k,r.m+1).map(x=>x.w).join(' : ')})대로 나눔</div>`;
    tgt=`<b>${per}p<small>/h</small></b><span>오늘 ${r.t}p · ${r.h}h</span><span>1p당 ${fmtSec(r.h*3600/r.t)}</span>`;
  }
  let res='';
  if(r.a!=null)res=`<span class="res ${rcls(r.t?r.a/r.t:1)}">${actTxt(r)} (${r.a}p)${r.t?` · ${pct(r.a/r.t)} · <b class="${gapCls(r.gap)}">${gapTxt(r.gap)}</b>`:''}${r.h?` · 실제 시간당 ${Math.round(r.a/r.h)}p`:''}</span>`;
  else if(L.s!=null&&r.t)res=`<span class="res muted">${L.s}p부터 시작 → 끝 p를 입력하세요</span>`;
  else if(N&&r.t&&d<TODAY)res='<span class="res r-b">기록 없음 · 0p로 계산됨</span>';
  const ty=r.rt&&RTYPE[r.rt.t];
  if(ty&&N&&r.h>0)info=`<div class="stg">${r.round}회독 · ${ty.n}</div>${info}<div class="why tipl">${ty.tip}${['ox','del','one'].includes(r.rt.t)?' '+SUBTIP[s]:''}</div>`;
  const piOn=ty&&['read','one','rot'].includes(r.rt.t);
  return `<div class="sub s-${s}${r.h===0&&r.a==null?' zero':''}" style="--p:${p}">
    <div class="n">${SN[s]}${N?`<small>총 ${N}p</small>`:''}</div>
    <div class="info">${info}</div>
    <div class="tgt">${tgt}</div>
    <div class="log">
      <label class="lg">시작 p <input type="number" inputmode="numeric" min="1" id="${id('s')}" data-f="log" data-k="s" ${at} value="${L.s??''}" placeholder="${r.startPg??''}"></label>
      <label class="lg">끝 p <input type="number" inputmode="numeric" min="1" id="${id('e')}" data-f="log" data-k="e" ${at} value="${L.e??''}" placeholder="${r.t&&r.startPg?((r.startPg+r.t-2)%N)+1:''}"></label>
      <label class="lg">시간 <input class="h" type="number" inputmode="decimal" step="0.25" min="0" id="${id('h')}" data-f="hrs" ${at} value="${r.h}">h</label>
      ${piOn?`<label class="lg">포스트잇 <input class="h" type="number" inputmode="numeric" min="0" id="${id('pi')}" data-f="log" data-k="pi" ${at} value="${L.pi??''}">개</label>`:''}
      ${res}
    </div></div>`;
}

function lowestBefore(d){
  const past=MOCKS.filter(m=>m<d&&S.mocks[m]&&SUBS.every(k=>num(S.mocks[m][k])!=null));
  if(!past.length)return null;
  const m=past.at(-1),x=S.mocks[m];
  const k=[...SUBS].sort((a,b)=>x[a]-x[b])[0];
  return {m,k,s:x[k]};
}

  const d=sel,w=wk(d),days=ALL.filter(x=>wk(x)===w),wr=weekRate(w),dr=dayRate(d),ev=events(d);

    <button class="btn" data-act="wk" data-n="-1"${w<=1?' disabled':''}>‹ 이전 주</button>
    <div class="wk-title">W${w}<span>${md(days[0])}(${WD[dow(days[0])]}) – ${md(days.at(-1))}(${WD[dow(days.at(-1))]})</span></div>
    <span class="sp"></span>
    ${TODAY>=START&&TODAY<=END&&d!==TODAY?`<button class="btn ghost" data-act="sel" data-d="${TODAY}">오늘로</button>`:''}

    <div class="pills">${days.map(x=>{const r=dayRate(x);return `<button class="pill${x===d?' on':''}${x===TODAY?' today':''}" data-act="sel" data-d="${x}"><span class="pd">${WD[dow(x)]}${MOCKS.includes(x)?' · 모의':''}</span><span class="pn">${md(x)}</span><span class="pr ${rcls(r)}">${S.off[x]?'휴식':pct(r)}</span></button>`}).join('')}</div>

  const hsum=SUBS.reduce((a,s)=>a+P[s][d].h,0)+ev.reduce((a,e)=>a+e.h,0);
  h+=`<div class="day"><div class="dayhead"><h2>${md(d)} (${WD[dow(d)]})</h2><span class="chip">W${w}</span>

    <label class="offt"><input type="checkbox" id="off-${d}" data-f="off" data-d="${d}"${S.off[d]?' checked':''}>쉬는 날 (분량을 다른 날로)</label></div>`;

  h+=SUBS.map(s=>subRow(d,s)).join('');
  if(dr!=null&&dr<.8)h+=`<div class="hint">오늘 달성 80% 미만 → 부족분은 마감까지 남은 날에 자동으로 더해졌습니다. 내일은 익숙한 과목 1h를 줄여 미달 과목에 넣는 것도 방법입니다.</div>`;
  if(MOCKS.includes(d)){
    const m=S.mocks[d]||{};
    h+=`<div class="box"><h3>모의고사 점수</h3><div class="inline">${SUBS.map(k=>`<label>${SN[k]} <input type="number" min="0" max="100" id="m-${d}-${k}" data-f="mock" data-d="${d}" data-k="${k}" value="${m[k]??''}"></label>`).join('')}</div>

  }
  const td=S.todo[d]||[];
  h+=`<div class="box"><h3>추가 할 일</h3>${td.map((t,i)=>`<div class="todo${t.done?' done':''}"><input type="checkbox" id="td-${d}-${i}-c" data-f="tdc" data-d="${d}" data-i="${i}"${t.done?' checked':''} aria-label="완료"><input type="text" id="td-${d}-${i}-t" data-f="tdt" data-d="${d}" data-i="${i}" value="${esc(t.t)}" placeholder="할 일"><button data-act="tddel" data-d="${d}" data-i="${i}">삭제</button></div>`).join('')}<div><button class="btn" data-act="tdadd" data-d="${d}">+ 추가</button></div></div>`;
  const tp=tips(d);

}

function vAll(){

  let lw=0;

    if(w!==lw){lw=w;const ds=ALL.filter(x=>wk(x)===w);h+=`<tr class="wsep"><td colspan="6">W${w} · ${md(ds[0])} – ${md(ds.at(-1))} · 주간 ${pct(weekRate(w))}</td></tr>`}

function vPlan(){
  let h=`<div class="sec"><div><h2>회독 계획</h2><p class="muted" style="margin:4px 0 0">회독마다 교재 1쪽부터 끝까지 한 바퀴 돕니다. 마감일이 같은 회독끼리 한 단계로 묶이고, 단계 마감까지 남은 회독을 시간 비중대로 나눕니다. 비중이 작을수록(지운 지문이 많을수록) 같은 시간에 더 많은 페이지를 넘깁니다. 앞서가면 뒤 회독들이 고르게 여유를 가져갑니다.</p></div>
  <div class="box"><h3>공부 기간</h3><div class="inline"><label>공부 시작일 <input class="tin" type="date" id="start" data-f="start" value="${START}" max="${addD(EXAM,-60)}"></label><span class="muted small">바꾸면 앞쪽 회독 마감일·기간별 시간·진입조건 점검일이 함께 이동합니다. 주차는 시작 요일부터 7일씩 끊습니다.</span></div><div class="inline"><label>시험 날짜 <input class="tin" type="date" id="exam" data-f="exam" value="${EXAM}" min="${addD(START,60)}"></label><span class="muted small">바꾸면 단권화 회전(D-31~), 모의고사 기간, 그 무렵의 회독 마감일이 시험일에 맞춰 함께 이동합니다. 실전 모의는 ${md(MOCK_START)}부터, 계획 마지막 날은 시험 전날 ${md(END)}입니다.</span></div></div>
  <div class="plans">`;
  for(const s of SUBS){
    const N=num(S.pages[s]),RD=S.rd[s],ends=RD.map(rEnd),dn=P[s].done;
    const piSum=Object.values(S.log).reduce((a,L)=>a+(num(L[s]&&L[s].pi)||0),0);
    h+=`<div class="plan s-${s}"><h3>${SN[s]} 기출</h3>
      <label class="tot">총 페이지 <input type="number" min="1" inputmode="numeric" id="pg-${s}" data-f="pages" data-s="${s}" value="${N??''}" placeholder="입력">p</label>
      <label class="tot">1회독 시작 페이지 <input type="number" min="1" inputmode="numeric" id="sa-${s}" data-f="startAt" data-s="${s}" value="${S.startAt[s]??''}" placeholder="1">p</label>
      <div class="rounds">${ends.map((e,k)=>{
        const done=N?Math.max(0,Math.min(N,dn-k*N)):0;
        const proj=N?ALL.find(d=>{const x=P[s][d];return x.after>=(k+1)*N}):null;
        const st=!N?'':done>=N?'완료':e<TODAY?`마감 지남 · ${done}/${N}p`:done>0?`진행 중 ${done}/${N}p`:'예정';
        const R=RD[k],newStage=k===0||ends[k-1]!==e;
        return `<div class="rd${newStage?' ns':''}"><span class="k">${k+1}회독</span><span class="ctl"><select id="rt-${s}-${k}" data-f="rtype" data-s="${s}" data-k="${k}" aria-label="단계">${Object.entries(RTYPE).map(([v,x])=>`<option value="${v}"${v===R.t?' selected':''}>${x.n}</option>`).join('')}</select><input class="w" type="number" step="0.1" min="0.1" id="rw-${s}-${k}" data-f="rw" data-s="${s}" data-k="${k}" value="${R.w}" title="시간 비중 (1회독=1)" aria-label="시간 비중"><input type="date" id="rd-${s}-${k}" data-f="rend" data-s="${s}" data-k="${k}" value="${e}" min="${START}" max="${END}" aria-label="${k+1}회독 단계 마감일"></span><button data-act="rdel" data-s="${s}" data-k="${k}">삭제</button>
          <span class="st">마감 ${md(e)}${st?' · '+st:''}${proj&&done<N?` · 예상 완료 ${md(proj)}`:''}</span>
          <div class="bar"><i style="width:${N?done/N*100:0}%"></i></div></div>`}).join('')}</div>
      <div class="inline"><button class="btn" data-act="radd" data-s="${s}">+ 회독 추가</button><span class="muted small">포스트잇 누적 ${piSum}개</span></div></div>`;
  }
  h+=`</div><div><h2>기간별 하루 시간</h2><p class="muted small" style="margin:4px 0 0">시작일부터 다음 기간 전까지 매일 적용됩니다. 모의고사 날은 과목당 1.5h(주말 모의 날은 학개론 2h)로 따로 잡힙니다. 특정 날만 바꾸려면 일자별 탭의 시간 칸을 고치세요.</p></div>
  <div class="tw"><table><thead><tr><th>시작일</th><th>행정법 h</th><th>법규 h</th><th>학개론 h</th><th>합계</th><th></th></tr></thead><tbody>
  ${S.phases.map((p,i)=>`<tr><td><input class="tin" type="date" id="ph-${i}-from" data-f="ph" data-i="${i}" data-k="from" value="${p.from}" min="${START}" max="${END}"></td>${SUBS.map(s=>`<td><input class="tin n" type="number" step="0.25" min="0" id="ph-${i}-${s}" data-f="ph" data-i="${i}" data-k="${s}" value="${p[s]}"></td>`).join('')}<td class="num">${SUBS.reduce((a,s)=>a+(+p[s]||0),0)}h</td><td>${i?`<button class="btn ghost" data-act="phdel" data-i="${i}">삭제</button>`:''}</td></tr>`).join('')}
  </tbody></table></div><div><button class="btn" data-act="phadd">+ 기간 추가</button></div></div>`;
  return h;
}

function vGates(){

}

function vMocks(){
  const rows=MOCKS.map(d=>{const m=S.mocks[d]||{};const sc=SUBS.map(k=>num(m[k]));const avg=sc.every(x=>x!=null)?Math.round(sc.reduce((a,b)=>a+b,0)/3*10)/10:null;return {d,m,avg}});
  const pts=rows.filter(r=>r.avg!=null);
  let spark='';
  if(pts.length>=2){
    const W=520,H=90,lo=Math.min(...pts.map(p=>p.avg)),hi=Math.max(...pts.map(p=>p.avg)),span=Math.max(hi-lo,5);
    const xy=pts.map((p,i)=>[24+i*(W-48)/(pts.length-1),H-16-(p.avg-lo)/span*(H-32)]);
    spark=`<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="모의고사 평균 점수 추이"><line x1="24" x2="${W-24}" y1="${H-16}" y2="${H-16}" stroke="var(--line)"/><polyline fill="none" stroke="var(--s-mock)" stroke-width="2" points="${xy.map(p=>p.join(',')).join(' ')}"/>${xy.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===xy.length-1?4:2.5}" fill="var(--s-mock)"/>`).join('')}<text x="${xy.at(-1)[0]}" y="${Math.max(10,xy.at(-1)[1]-8)}" text-anchor="end">${pts.at(-1).avg}</text><text x="24" y="${H-3}">${md(pts[0].d)}</text><text x="${W-24}" y="${H-3}" text-anchor="end">${md(pts.at(-1).d)}</text></svg>`;
  }
  const inp=(d,k,v)=>`<input class="tin n" type="number" min="0" id="mm-${d}-${k}" data-f="mock" data-d="${d}" data-k="${k}" value="${v??''}" aria-label="${k}">`;
  return `<div class="sec"><div><h2>모의고사 기록</h2><p class="muted" style="margin:4px 0 0">주말 모의 ${MOCK_J.length}회(${MOCK_J.map(md).join(', ')}) + 실전 ${MOCK_F.length}회(${md(MOCK_START)}~). 점수를 넣으면 다음 날부터 최저 과목 +1h 안내가 뜹니다.</p></div>${spark}
  <div class="tw"><table><thead><tr><th>날짜</th><th>법규</th><th>행정법</th><th>학개론</th><th>평균</th><th>개념</th><th>헷갈림</th><th>시간</th><th>마킹</th><th>과목 순서 · 메모</th></tr></thead><tbody>
  ${rows.map(({d,m,avg})=>`<tr${d===TODAY?' class="today"':''}><td class="date">${md(d)} ${WD[dow(d)]}</td>${['beop','haeng','hak'].map(k=>`<td>${inp(d,k,m[k])}</td>`).join('')}<td class="num">${avg??'–'}</td>${['c1','c2','c3','c4'].map(k=>`<td>${inp(d,k,m[k])}</td>`).join('')}<td><input class="tin" id="mm-${d}-memo" data-f="mock" data-d="${d}" data-k="memo" value="${esc(m.memo)}" placeholder="법→행→학" style="min-width:140px"></td></tr>`).join('')}
  </tbody></table></div>
  <div><h2>시행처별 20분 타임어택</h2><p class="muted" style="margin:4px 0 0">D-30부터 최신 3개년 시행처별 기출을 20분씩. 안다고 착각한 구멍 지문을 솎아내는 용도입니다.</p></div>
  <div class="tw"><table><thead><tr><th>날짜</th><th>과목</th><th>시행처 · 연도</th><th>점수</th><th>틀린 지문 메모</th><th></th></tr></thead><tbody>
  ${(S.ta||[]).map((x,i)=>`<tr><td><input class="tin" type="date" id="ta-${i}-d" data-f="ta" data-i="${i}" data-k="d" value="${x.d||''}"></td><td><select class="tin" id="ta-${i}-s" data-f="ta" data-i="${i}" data-k="s">${SUBS.map(s=>`<option value="${s}"${s===x.s?' selected':''}>${SN[s]}</option>`).join('')}</select></td><td><input class="tin" id="ta-${i}-src" data-f="ta" data-i="${i}" data-k="src" value="${esc(x.src)}" placeholder="예: 2025 국가직"></td><td><input class="tin n" type="number" min="0" max="100" id="ta-${i}-sc" data-f="ta" data-i="${i}" data-k="sc" value="${x.sc??''}"></td><td><input class="tin" id="ta-${i}-m" data-f="ta" data-i="${i}" data-k="m" value="${esc(x.m)}" style="min-width:160px"></td><td><button class="btn ghost" data-act="tadel" data-i="${i}">삭제</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">아직 기록이 없습니다. 아래 버튼으로 추가하세요.</td></tr>'}
  </tbody></table></div><div><button class="btn" data-act="taadd">+ 타임어택 기록</button></div></div>`;
}

function vRules(){
  return `<div class="sec"><h2>운영 규칙</h2><div class="rules">
  <div class="box"><h3>기출 회독 · 단권화 로드맵</h3><ul><li>범위 확인: 1시간 50~60문제, 과목당 1주 컷</li><li>2~3회독: 한 과목씩 도장깨기, 지문 단위 O/X, 모르는 지문만 X</li><li>4~5회독: 아는 지문 삭제 + 기본서/요약집 정독</li><li>단권화: 메인 1권, 노답 지문에 포스트잇 (몰린 단원 = 약점)</li><li>D-31~전날: 단권화 회전 16 → 8 → 4 → 2 → 1일, 시행처별 20분 타임어택, 가리고 맞히기</li></ul></div>
  <div class="box"><h3>자동 재계획</h3><ul><li>매일 과목별 시작 p와 끝 p를 입력하면 본 페이지 수가 계산됩니다. 시작 p를 비우면 계획된 시작 페이지로 봅니다.</li><li>지난 날을 비워 두면 0p로 계산되어 마감까지 남은 날에 다시 나눠집니다.</li><li>앞서 나가면 다음 회독 분량이 미리 배정됩니다.</li><li>쉬는 날로 표시하면 그날 분량이 다른 날로 옮겨집니다.</li></ul></div>
  <div class="box"><h3>일일 · 주간 기준</h3><ul><li>하루 기준 7.5h (최소 7h, 최대 8h)</li><li>주차는 ${WD[dow(START)]}요일 시작 → ${WD[(dow(START)+6)%7]}요일 끝, 마지막 날 오후 2h는 버퍼</li><li>달성률 80% 미만: 다음 날 익숙한 과목 1h를 줄여 미달 과목에</li><li>주간 미달 20% 초과: 다음 주 가장 익숙한 과목을 50% 줄여 만회</li></ul></div>
  <div class="box"><h3>모의고사 날 (7.5h)</h3><ul><li>실제 시험 시각에 3과목 한 번에, 75분: 법규 20 → 행정법 25 → 학개론 25 → 마킹 5</li><li>채점 · 오답 분류 1.5h: 개념 / 헷갈림 / 시간 / 마킹</li><li>회독 과목당 1.5h, 틀린 지문은 압축본에 추가</li></ul></div>
  <div class="box"><h3>고정일 (절대 미루지 않음)</h3><ul><li>단권화 회전 시작 ${md(addD(END,-30))} (16 → 8 → 4 → 2 → 1일)</li><li>모의고사 기간 시작 ${md(MOCK_START)}</li><li>시험 ${md(EXAM)}</li></ul></div>
  </div>
  <h2>백업</h2>
  <div class="box"><p class="muted" style="margin:0">기록은 이 브라우저에 저장되어 페이지가 업데이트되어도 그대로 남습니다. 다른 기기로 옮기거나 브라우저 데이터를 지울 때는 백업 파일을 저장해 두세요.</p>
    <div class="dayact inline"><button class="btn" data-act="dl">백업 파일 저장</button><label class="btn" for="file-in">백업 파일 불러오기</label><input type="file" id="file-in" accept="application/json,.json" hidden><button class="btn ghost" data-act="wipe" id="wipe">전체 초기화</button><span class="muted small" id="bk-msg"></span></div></div></div>`;
}

/* 이벤트 */
let armed=null;
const V=document.getElementById('view');
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,d=b.dataset.d,i=+b.dataset.i,s=b.dataset.s,k=+b.dataset.k;
  if(a==='tab'){tab=b.dataset.t;render();window.scrollTo({top:0});return}
  if(a==='sel'){sel=d;tab='day';render();return}
  if(a==='wk'){const w=wk(sel)+ +b.dataset.n;sel=ALL.find(x=>wk(x)===w)||sel;render();return}
  if(a==='tdadd'){(S.todo[d]||(S.todo[d]=[])).push({t:'',done:false});focusNext=`td-${d}-${S.todo[d].length-1}-t`;persist();render();return}
  if(a==='tddel'){S.todo[d].splice(i,1);if(!S.todo[d].length)delete S.todo[d];persist();render();return}
  if(a==='radd'){const r=S.rd[s];r.push(r.length?{...r.at(-1)}:{t:'rot',w:.3,a:'e',o:0});persist();render();return}
  if(a==='rdel'){if(S.rd[s].length<=1)return;S.rd[s].splice(k,1);persist();render();return}
  if(a==='phadd'){const l=S.phases.at(-1);S.phases.push({...l,from:addD(l.from,7)>END?END:addD(l.from,7)});S.phases.sort((x,y)=>x.from<y.from?-1:1);persist();render();return}
  if(a==='taadd'){(S.ta||(S.ta=[])).push({d:TODAY,s:'haeng',src:'',sc:null,m:''});persist();render();return}
  if(a==='tadel'){S.ta.splice(i,1);persist();render();return}
  if(a==='phdel'){S.phases.splice(i,1);persist();render();return}
  if(a==='dl'){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const u=URL.createObjectURL(blob),el=document.createElement('a');
    el.href=u;el.download=`소방플래너-백업-${TODAY}.json`;document.body.appendChild(el);el.click();el.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
    return;
  }
  if(a==='wipe'){
    if(armed!=='wipe'){armed='wipe';b.textContent='한 번 더 누르면 모두 삭제';return}
    armed=null;adopt(null);persist();render();return;
  }
});
V.addEventListener('change',e=>{
  const el=e.target,f=el.dataset.f;
  if(el.id==='file-in'){
    const file=el.files[0];if(!file)return;
    file.text().then(t=>{try{const j=JSON.parse(t);if(!j||j.v!==2)throw 0;adopt(j);persist();render()}catch(err){document.getElementById('bk-msg').textContent='이 플래너의 백업 파일이 아닙니다.'}});
    return;
  }
  if(!f)return;
  const d=el.dataset.d,s=el.dataset.s,k=el.dataset.k,i=+el.dataset.i;
  if(f==='log'){
    const L=S.log[d]||(S.log[d]={}),x=L[s]||(L[s]={}),v=num(el.value);
    if(v==null)delete x[k];else x[k]=v;
    if(!Object.keys(x).length)delete L[s];
    if(!Object.keys(L).length)delete S.log[d];
  }
  else if(f==='hrs'){
    const v=num(el.value),H=S.hours[d]||(S.hours[d]={});
    if(v==null||v===num(defHours(d)[s]))delete H[s];else H[s]=v;
    if(!Object.keys(H).length)delete S.hours[d];
  }
  else if(f==='off'){if(el.checked)S.off[d]=true;else delete S.off[d]}
  else if(f==='note'){if(el.value.trim())S.notes[d]=el.value;else delete S.notes[d]}
  else if(f==='tdc')S.todo[d][i].done=el.checked;
  else if(f==='tdt')S.todo[d][i].t=el.value;
  else if(f==='start'){if(!el.value||el.value<'2020-01-01'||el.value>=addD(EXAM,-30))return;changeStart(el.value);if(sel<START||sel>END)sel=START}
  else if(f==='exam'){if(!el.value||el.value<=addD(START,30))return;changeExam(el.value);if(sel>END)sel=END}
  else if(f==='pages')S.pages[s]=num(el.value);
  else if(f==='startAt'){const v=num(el.value);if(v==null||v===1)delete S.startAt[s];else S.startAt[s]=v}
  else if(f==='rend'){if(!el.value||el.value<START||el.value>END)return;Object.assign(S.rd[s][+k],toAnchor(el.value));S.rd[s].sort((x,y)=>rEnd(x)<rEnd(y)?-1:rEnd(x)>rEnd(y)?1:0)}
  else if(f==='rtype')S.rd[s][+k].t=el.value;
  else if(f==='rw'){const v=num(el.value);if(v==null||v<=0)return;S.rd[s][+k].w=v}
  else if(f==='ph'){const p=S.phases[i];if(k==='from'){if(!el.value)return;p.from=el.value;S.phases.sort((x,y)=>x.from<y.from?-1:1)}else p[k]=num(el.value)??0}
  else if(f==='mock'){const m=S.mocks[d]||(S.mocks[d]={});if(k==='memo')m.memo=el.value;else{const v=num(el.value);if(v==null)delete m[k];else m[k]=v}}
  else if(f==='gate'){const g=S.gates[el.dataset.g]||(S.gates[el.dataset.g]={});(g.c||(g.c=[]))[+k]=el.checked}
  else if(f==='ta'){const x=S.ta[i];x[k]=k==='sc'?num(el.value):el.value}
  else if(f==='grate'){const g=S.gates[el.dataset.g]||(S.gates[el.dataset.g]={});g[k]=num(el.value)}
  persist();later();
});
V.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input:not([type=checkbox])'))e.target.blur()});
render();
</script>
